<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoogleRefreshed system monitor</title><link rel="stylesheet" href="hardware.css"></head><body><div id="monitor"><div class="metrics"><section><div class="label"><span>CPU</span><strong id="cpu-value">—</strong></div><div class="model" id="cpu-model">Detecting processor…</div><svg viewBox="0 0 140 32" preserveAspectRatio="none" aria-label="CPU usage history"><polyline id="cpu-graph" points="0,31 140,31"/></svg></section><section><div class="label"><span>RAM</span><strong id="ram-value">—</strong></div><div class="model" id="ram-model">Physical memory</div><svg viewBox="0 0 140 32" preserveAspectRatio="none" aria-label="Memory usage history"><polyline id="ram-graph" points="0,31 140,31"/></svg></section></div><div class="chart-scale">Both charts use 0–100% · last 60 seconds</div><div class="details" id="hardware-details">Connecting to your system…</div><div class="extras"><div><span class="extra-label">GPU renderer · reported by Brave</span><span class="extra-value" id="gpu-name">Checking…</span></div><div><span class="extra-label">Network · browser estimate</span><span class="extra-value" id="network-info">Checking…</span></div><div><span class="extra-label">CPU temperature</span><span class="extra-value" id="cpu-temperature">Not exposed on Windows</span></div><div><span class="extra-label">GPU load / temperature</span><span class="extra-value">Not exposed by Brave</span></div></div></div><textarea id="note" maxlength="1000" placeholder="What would you like to focus on?" aria-label="Your focus note" dir="auto" hidden></textarea><script src="shared.js"></script><script src="hardware.js"></script></body></html>
