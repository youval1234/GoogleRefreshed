<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoogleRefreshed system monitor</title><link rel="stylesheet" href="hardware.css"></head><body><div id="monitor"><div class="metrics"><section><div class="label"><span class="metric-title"><svg class="hardware-icon" data-hardware-icon="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 1v5m6-5v5M9 18v5m6-5v5M1 9h5m-5 6h5m12-6h5m-5 6h5"/></svg>CPU</span><strong id="cpu-value">—</strong></div><div class="model" id="cpu-model">Detecting processor…</div><svg viewBox="0 0 140 32" preserveAspectRatio="none" aria-label="CPU usage history"><polyline id="cpu-graph" points="0,31 140,31"/></svg></section><section><div class="label"><span class="metric-title"><svg class="hardware-icon" data-hardware-icon="ram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v10H3Z M6 17v3m4-3v3m4-3v3m4-3v3"/><path d="M6 10h3v4H6zm5 0h3v4h-3zm5 0h2v4h-2z"/></svg>RAM</span><strong id="ram-value">—</strong></div><div class="model" id="ram-model">Physical memory</div><svg viewBox="0 0 140 32" preserveAspectRatio="none" aria-label="Memory usage history"><polyline id="ram-graph" points="0,31 140,31"/></svg></section></div><div class="chart-scale">Both charts use 0–100% · last 60 seconds</div><div class="sample-status" id="sample-status" role="status" hidden></div><div class="details" id="hardware-details">Connecting to your system…</div></div><textarea id="note" maxlength="1000" placeholder="What would you like to focus on?" aria-label="Your focus note" dir="auto" hidden></textarea><script src="shared.js"></script><script src="hardware.js"></script></body></html>
